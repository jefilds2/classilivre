workflows:
  ios_release:
    name: Classi Livre Autos iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect"
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "br.com.classilivre.autos"
        XCODE_PROJECT: "mobile-app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "$BUNDLE_ID"
    scripts:
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Apply signing profiles to project
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

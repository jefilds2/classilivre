<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>📊 Dashboard de Métricas - Propagandas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 { color: #333; margin-bottom: 10px; }
        .header p { color: #666; font-size: 14px; }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }
        
        .metric-card.views { border-left-color: #4CAF50; }
        .metric-card.clicks { border-left-color: #FF9800; }
        .metric-card.ctr { border-left-color: #2196F3; }
        .metric-card.campaigns { border-left-color: #9C27B0; }
        
        .metric-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }
        
        .metric-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .campaigns-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .table-header {
            background: #f5f5f5;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .table-header h2 { color: #333; font-size: 18px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead tr { background: #f9f9f9; }
        thead th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 2px solid #eee;
        }
        
        tbody td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }
        
        tbody tr:hover { background: #fafafa; }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-active { background: #E8F5E9; color: #2E7D32; }
        .status-inactive { background: #FFEBEE; color: #C62828; }
        .status-paused { background: #FFF3E0; color: #E65100; }
        
        .type-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: #f0f0f0;
        }
        
        .type-web { background: #E3F2FD; color: #1565C0; }
        .type-local { background: #F3E5F5; color: #6A1B9A; }
        .type-embed { background: #FCE4EC; color: #C2185B; }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .error {
            background: #FFEBEE;
            border-left: 4px solid #F44336;
            padding: 15px;
            border-radius: 4px;
            color: #C62828;
            margin-bottom: 20px;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover { background: #5568d3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Dashboard de Métricas - Sistema de Propaganda</h1>
        <p id="timestamp">Carregando...</p>
        <button class="refresh-btn" onclick="loadMetrics()">🔄 Atualizar</button>
    </div>
    
    <div id="error"></div>
    
    <div id="loading" class="loading">
        ⏳ Carregando métricas...
    </div>
    
    <div id="content" style="display: none;">
        <div class="metrics-grid" id="metricsGrid"></div>
        <div class="campaigns-table">
            <div class="table-header">
                <h2>Campanhas Ativas</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th>Visualizações</th>
                        <th>Cliques</th>
                        <th>CTR</th>
                        <th>Última Atualização</th>
                    </tr>
                </thead>
                <tbody id="campaignsTable">
                    <tr><td colspan="8" class="no-data">Nenhuma campanha encontrada</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function loadMetrics() {
    const loading = document.getElementById('loading');
    const content = document.getElementById('content');
    const errorDiv = document.getElementById('error');
    
    loading.style.display = 'block';
    content.style.display = 'none';
    errorDiv.innerHTML = '';
    
    fetch('/propagandas/admin/api/dashboard-metrics.php')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                renderDashboard(data);
                loading.style.display = 'none';
                content.style.display = 'block';
            } else {
                throw new Error(data.error || 'Erro desconhecido');
            }
        })
        .catch(e => {
            errorDiv.innerHTML = `<div class="error">❌ Erro: ${e.message}</div>`;
            loading.style.display = 'none';
            console.error(e);
        });
}

function renderDashboard(data) {
    const totals = data.totals;
    const campaigns = data.campaigns;
    
    // Timestamp
    document.getElementById('timestamp').textContent = `Última atualização: ${data.timestamp}`;
    
    // Metrics grid
    const metricsHtml = `
        <div class="metric-card views">
            <div class="metric-label">📊 Visualizações Totais</div>
            <div class="metric-value">${totals.total_views.toLocaleString('pt-BR')}</div>
        </div>
        <div class="metric-card clicks">
            <div class="metric-label">🖱️ Cliques Totais</div>
            <div class="metric-value">${totals.total_clicks.toLocaleString('pt-BR')}</div>
        </div>
        <div class="metric-card ctr">
            <div class="metric-label">📈 CTR Geral</div>
            <div class="metric-value">${totals.overall_ctr.toFixed(2)}%</div>
        </div>
        <div class="metric-card campaigns">
            <div class="metric-label">🎯 Campanhas</div>
            <div class="metric-value">${totals.total_campaigns}</div>
        </div>
    `;
    document.getElementById('metricsGrid').innerHTML = metricsHtml;
    
    // Campaigns table
    if (campaigns.length === 0) {
        document.getElementById('campaignsTable').innerHTML = 
            '<tr><td colspan="8" class="no-data">Nenhuma campanha encontrada</td></tr>';
    } else {
        const tableHtml = campaigns.map(c => `
            <tr>
                <td><strong>#${c.id}</strong></td>
                <td>${c.title}</td>
                <td><span class="type-badge type-${c.type.toLowerCase()}">${c.type}</span></td>
                <td>${getStatusBadge(c.status)}</td>
                <td><strong>${c.views.toLocaleString('pt-BR')}</strong></td>
                <td><strong>${c.clicks.toLocaleString('pt-BR')}</strong></td>
                <td>${c.ctr.toFixed(2)}%</td>
                <td>${c.updated_at}</td>
            </tr>
        `).join('');
        document.getElementById('campaignsTable').innerHTML = tableHtml;
    }
}

function getStatusBadge(status) {
    const statusText = status.replace('✅ ', '').replace('⛔ ', '').replace('⏸️ ', '');
    let className = 'status-active';
    if (status.includes('Inativa')) className = 'status-inactive';
    if (status.includes('Pausada')) className = 'status-paused';
    return `<span class="status-badge ${className}">${status}</span>`;
}

// Carregar ao abrir página
document.addEventListener('DOMContentLoaded', loadMetrics);
</script>

</body>
</html>
